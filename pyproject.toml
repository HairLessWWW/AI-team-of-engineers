[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-platform"
version = "0.1.0"
description = "MVP skeleton for an AI agent platform for robotics engineering and manufacturing readiness."
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
